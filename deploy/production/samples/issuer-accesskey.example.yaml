apiVersion: v1
kind: Secret
metadata:
  name: akeyless-api-key
  namespace: akeyless-cert-manager-system
type: Opaque
stringData:
  access-id: YOUR_ACCESS_ID
  access-key: YOUR_ACCESS_KEY
---
apiVersion: certmanager.akeyless.io/v1alpha1
kind: AkeylessClusterIssuer
metadata:
  name: akeyless-pki
spec:
  apiUrl: https://YOUR_GW_HOST:PORT/v2
  certIssuerName: /Path/To/CertIssuer
  auth:
    accessKey:
      secretRef:
        name: akeyless-api-key
